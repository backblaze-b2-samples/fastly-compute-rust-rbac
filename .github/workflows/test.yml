on: pull_request
name: Test
jobs:
  test:
    strategy:
      matrix:
        rust-toolchain: [stable]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    environment: test
    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Install Rust
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: ${{ matrix.rust-toolchain }}
    - name: Add wasm32-wasip1 Rust target
      run: rustup target add wasm32-wasip1 --toolchain ${{ matrix.rust-toolchain }}
    - name: Cache cargo registry
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    - name: Install fmt
      run: rustup component add rustfmt
      shell: bash
    - name: Install clippy
      run: rustup component add clippy
      shell: bash
    - name: Install audit
      run: cargo install cargo-audit
      shell: bash 
    - name: Prepare to store metadata
      run: mkdir -p src/well-known
      shell: bash
    - name: Store JWKS metadata
      run: echo "${{ secrets.JWKS_JSON }}" > src/well-known/jwks.json
      shell: bash    
    - name: Store OIDC metadata
      run: echo "${{ secrets.OIDC_METADATA_JSON }}" > src/well-known/openid-configuration.json
      shell: bash
    - name: Check binaries and format
      run: RUSTFLAGS="--deny warnings" cargo check --bins --target wasm32-wasip1 && cargo fmt -- --check
      shell: bash
    - name: clippy
      run: cargo clippy
      shell: bash
    - name: audit
      run: cargo audit
      shell: bash
    - name: build
      run: cargo build
      shell: bash